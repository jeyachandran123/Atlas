global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: ai-coding-assistant

scrape_configs:
  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /api/v1/admin/metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
