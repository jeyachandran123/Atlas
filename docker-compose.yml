version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# AI Coding Assistant — Local Development Stack
#
# Quick start:
#   cp .env.example .env
#   docker compose up
#
# First time: pull an Ollama model:
#   docker compose exec ollama ollama pull qwen2.5-coder:7b
#   docker compose exec ollama ollama pull nomic-embed-text
#
# Access:
#   API docs    → http://localhost:8000/docs
#   Health      → http://localhost:8000/api/v1/admin/health
#   Metrics     → http://localhost:8000/api/v1/admin/metrics
#   Grafana     → http://localhost:3001  (admin/admin)
#   ChromaDB    → http://localhost:8001
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── AI Coding Assistant API ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ai-coding-assistant:latest
    # Explicit command: api and worker share one image tag, so whichever build
    # target gets tagged last would otherwise decide what this container runs.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--loop", "asyncio"]
    container_name: aic_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      # Ollama runs on the Windows host, not in a container
      OLLAMA_HOST: http://host.docker.internal:11434
      APP_ENV: development
      APP_DEBUG: "true"
    volumes:
      - ./app:/app/app:ro              # live reload in dev
      - ./data:/app/data               # vision + document uploads (writable, persistent)
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro  # Firebase auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/admin/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - aic_net

  # ── Index Worker ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: ai-coding-assistant:latest
    # Explicit command: both services share one image tag, so whichever build
    # target gets tagged last would otherwise decide what this container runs.
    command: ["python", "-m", "app.workers.index_worker"]
    # The worker serves no HTTP — disable the inherited API healthcheck
    healthcheck:
      disable: true
    container_name: aic_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      # Ollama runs on the Windows host, not in a container
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - ./app:/app/app:ro                    # live reload in dev
      - ./data:/app/data                     # shared upload storage with api
      - C:/Users/Jayachandran:/host_home:ro  # access to local repos (read-only)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - aic_net

  # ── Document Processing Worker (DIP Phase 2+) ────────────────────────────────
  document_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: ai-coding-assistant:latest
    # Explicit command: all three services share one image tag, so whichever
    # build target gets tagged last would otherwise decide what this runs.
    command: ["python", "-m", "app.workers.document_worker"]
    # The worker serves no HTTP — disable the inherited API healthcheck
    healthcheck:
      disable: true
    container_name: aic_document_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - ./app:/app/app:ro       # live reload in dev
      - ./data:/app/data        # shared blob storage fallback root with api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aic_net

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aic_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_coding_assistant}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aic_net

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aic_net

  # ── ChromaDB ────────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: aic_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_SERVER_HTTP_PORT: 8000
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - aic_net

  # ── Ollama (local AI models) ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: aic_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - aic_net

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: aic_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - aic_net

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: aic_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - aic_net

  # ── Jaeger (distributed tracing) ─────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aic_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - aic_net


volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_models:
  prometheus_data:
  grafana_data:

networks:
  aic_net:
    driver: bridge
