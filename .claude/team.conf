# unityworks-team project configuration — format: the plugin's team-setup skill.
# One "key = value" per line; repeat a key for a list; " :: " separates parts.

name    = UnityWorks AI Assistant backend
kind    = ai-assistant-backend
reviews = docs/reviews

protect = app/vision_os/ :: app/vision_os/ is the original Vision OS tree, migrated verbatim — don't lint or redesign it. The production copy lives in the Vision AI backend.

block = compose down :: docker compose down recreates the postgres container and has already destroyed this database once (IMPORTANT_DB_WARNING.md). Use restart, stop or up -d.
block = alembic downgrade :: Downgrades drop data. Write a forward migration instead.

# The 75% coverage gate lives in addopts, so subset runs need --no-cov.
gate = app/ tests/ :: pytest :: .\venv\Scripts\python.exe -m pytest <the tests for what changed> --no-cov
gate = app/ tests/ :: ruff check :: .\venv\Scripts\python.exe -m ruff check <files you touched>


harden = default :: ai-ml-architect security-engineer backend-engineer qa-engineer
harden = ai :: ai-ml-architect qa-engineer
